# ---- Easel 镜像构建工作流（复刻 jianzhi build-and-push.yml 模式）----
# 触发: push main 分支 / workflow_dispatch（n8n 定时 dispatch，同 jianzhi）
# 产物: ghcr.io/guge98c/easel（linux/amd64，tag: branch / sha / main→latest）
name: Build and Push Easel Image

on:
  push:
    branches: [main, custom]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/guge98c/easel
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=easel
          cache-to: type=gha,mode=max,scope=easel
          platforms: linux/amd64
